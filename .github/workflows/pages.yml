name: Docs site
# Publishes site/ to GitHub Pages: the docs (static HTML) and the live demo
# (site/demo, with the <script> build of this commit copied in).
on:
  push:
    branches: [main]
    # The docs and the live demo; the demo runs the packages' current build.
    # The scripts that build the demo and the lock file (the React and Vue it bundles) count too.
    paths: ['site/**', 'packages/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deployment that has begun is never cut off halfway (GitHub's own Pages template).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # site/demo runs the <script> build of @acunsoft/datatable, built from this commit.
      - run: npm run demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
